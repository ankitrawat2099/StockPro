services:
  # API Gateway (Public Web Service)
  - type: web
    name: stockpro-gateway
    runtime: docker
    dockerContext: StockPro/ApiGateway
    dockerfilePath: StockPro/ApiGateway/Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://*:8080

  # Microservices
  - type: web
    name: auth-service
    runtime: docker
    dockerContext: StockPro/AuthService
    dockerfilePath: StockPro/AuthService/Dockerfile
    plan: free
    envVars:
      - key: ConnectionStrings__DefaultConnection
        value: "Host=dpg-d7t1kdv7f7vs73dgjuvg-a.ohio-postgres.render.com;Port=5432;Database=stockpro_db_h4wv;Username=stockpro_user;Password=lt4tX1BWS8LoCdykbMNmKrRYM7LGQWkS;Pooling=true;TrustServerCertificate=true;"
      - key: ASPNETCORE_URLS
        value: http://*:8080

