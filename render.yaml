services:
  # API Gateway (Public Web Service)
  - type: web
    name: stockpro-gateway
    runtime: docker
    dockerContext: StockPro/ApiGateway
    dockerfilePath: StockPro/ApiGateway/Dockerfile
    plan: free
    envVars:
      - key: ASPNETCORE_URLS
        value: http://*:8080

  # Microservices (Private Services)
  - type: pserv
    name: auth-service
    runtime: docker
    dockerContext: StockPro/AuthService
    dockerfilePath: StockPro/AuthService/Dockerfile
    plan: free
    envVars:
      - key: ConnectionStrings__DefaultConnection
        value: postgresql://stockpro_user:lt4tX1BWS8LoCdykbMNmKrRYM7LGQWkS@dpg-d7t1kdv7f7vs73dgjuvg-a.ohio-postgres.render.com/stockpro_db_h4wv
      - key: ASPNETCORE_URLS
        value: http://*:8080

